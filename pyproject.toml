[project]
name = "example2"
version = "0.1.0"
description = "A minimal weather API serving random weather for Astana and Almaty"
requires-python = ">=3.14"
dependencies = ["fastapi[standard]"]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

